[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cooked"
version = "0.1.0"
description = "COOKED synthetic-data hackathon foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "pre-commit>=4,<5", "playwright>=1.51,<2"]

[tool.setuptools.packages.find]
include = ["api*", "scripts*", "worker*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires migrated and loaded TimescaleDB", "handoff: pending backend/ML implementation"]

[tool.ruff]
line-length = 100
