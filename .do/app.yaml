# Import once, then populate encrypted secrets in the DO dashboard before deploying.
# CI triggers deployments only after tests pass; direct push auto-deploy is disabled.
name: cooked
region: nyc
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: api
    github:
      repo: bhattarya/Cooked
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: api/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 15
      timeout_seconds: 5
    envs:
      - key: DATABASE_URL_APP
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: DATABASE_URL_AGENT
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: GEMINI_API_KEY
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-3.8-flash
      - key: BACKBOARD_API_KEY
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: BACKBOARD_BASE_URL
        scope: RUN_TIME
        value: https://app.backboard.io/api
      - key: ELEVENLABS_API_KEY
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: ELEVENLABS_MODEL
        scope: RUN_TIME
        value: eleven_flash_v2_5
      # premade voices (free plan): narrator Eric, coach Sarah
      - key: VOICE_ID_NARRATOR
        scope: RUN_TIME
        value: cjVigY5qzO86Huf0OWal
      - key: VOICE_ID_COACH
        scope: RUN_TIME
        value: EXAVITQu4vr4xnSDxMaL
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: API_ROOT_PATH
        scope: RUN_TIME
        value: /api
      - key: MODEL_ARTIFACT_DIR
        scope: RUN_TIME
        value: models/
      - key: DEMO_MODE
        scope: RUN_TIME
        value: "0"
      # Firebase ID tokens are verified with only the project ID (public, not a secret)
      - key: FIREBASE_PROJECT_ID
        scope: RUN_TIME
        value: ""
  - name: web
    github:
      repo: bhattarya/Cooked
      branch: main
      deploy_on_push: false
    source_dir: web
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start -- --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}/api
      # sign-in: the web app's own routes live under /auth (the /api prefix belongs to the API)
      - key: AUTH_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: AUTH_SECRET
        type: SECRET
        scope: RUN_TIME
        value: ""
      # Google sign-in through Firebase (preferred). The web config is public and inlined at build time.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
        scope: RUN_AND_BUILD_TIME
        value: ""
      # Fallback: plain Google OAuth, used only when Firebase isn't configured
      - key: AUTH_GOOGLE_ID
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: AUTH_GOOGLE_SECRET
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: ELEVENLABS_API_KEY
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: ELEVENLABS_AGENT_ID
        scope: RUN_TIME
        value: ""
workers:
  - name: worker
    github:
      repo: bhattarya/Cooked
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: api/Dockerfile
    run_command: python -m worker.watchtower
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL_APP
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: MODEL_ARTIFACT_DIR
        scope: RUN_TIME
        value: models/
      - key: WATCHTOWER_INTERVAL_SECONDS
        scope: RUN_TIME
        value: "1800"
# Owner credentials intentionally stay off API/web/worker; migrations run separately.
